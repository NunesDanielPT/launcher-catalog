<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShowKit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="logo.png" alt="" class="brand-logo" data-tauri-drag-region>
      <span class="brand-name" data-tauri-drag-region>SHOWKIT</span>
    </div>
    <div class="brand-sub" data-tauri-drag-region data-i18n="suite">APP SUITE</div>
    <nav class="tabs">
      <button class="tab active" data-tab="apps" data-i18n="tabApps">APLICAÇÕES</button>
      <button class="tab" data-tab="donate"><span class="heart">♥</span> <span data-i18n="tabDonate">DOAÇÕES</span></button>
    </nav>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="tb-btn" id="btn-settings" data-i18n-title="settings" title="Definições">
      <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4Z"/></svg>
    </button>
    <button class="tb-btn win" id="btn-min" title="Minimizar"><svg viewBox="0 0 12 12" width="11" height="11"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="tb-btn win" id="btn-max" title="Maximizar"><svg viewBox="0 0 12 12" width="11" height="11"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="tb-btn win close" id="btn-close" title="Fechar"><svg viewBox="0 0 12 12" width="11" height="11"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </header>

  <div id="self-update" class="banner hidden"></div>

  <main>
    <section id="donate-view" class="hidden"></section>
    <div id="apps-view">
    <div class="toolbar">
      <button class="icon-btn" id="btn-refresh" data-i18n-title="refresh" title="Verificar atualizações">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <div class="spacer"></div>
      <label class="label" for="sort" data-i18n="sort">ORDENAR</label>
      <div class="select-wrap">
        <select id="sort">
          <option value="name" data-i18n="sortName">Nome (A–Z)</option>
          <option value="name-desc" data-i18n="sortNameDesc">Nome (Z–A)</option>
          <option value="updated" data-i18n="sortUpdated">Atualizado recentemente</option>
        </select>
      </div>
      <input id="search" type="search" data-i18n-placeholder="search" placeholder="Procurar aplicações" autocomplete="off">
      <div class="seg">
        <button id="view-grid" class="active" data-i18n-title="grid" title="Grelha">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1zM9 9h6v6H9z"/></svg>
        </button>
        <button id="view-list" data-i18n-title="list" title="Lista">
          <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M1 2h14v1.6H1zM1 7.2h14v1.6H1zM1 12.4h14V14H1z"/></svg>
        </button>
      </div>
    </div>

    <div id="content"></div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="status">—</span>
    <div class="spacer"></div>
    <button class="foot-link" id="foot-github" title="github.com/NunesDanielPT">
      <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.96 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.08-1.87 3.76-3.66 3.96.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
    </button>
  </footer>

  <div id="menu" class="menu hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toasts"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="donate.js"></script>
</body>
</html>
